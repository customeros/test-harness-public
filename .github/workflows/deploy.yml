name: Deploy Frontera App

on:
  # Automated trigger from Create Release workflow
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        type: string
        required: true

jobs:
  # Main deployment job
  deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0  # Needed to fetch all tags

      - name: Validate manual version input
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAGS=$(git tag -l)
          if ! echo "$TAGS" | grep -q "^${{ inputs.version }}$"; then
            echo "Error: Version ${{ inputs.version }} is not a valid tag"
            echo "Available tags:"
            echo "$TAGS"
            exit 1
          fi
          echo "Version ${{ inputs.version }} is valid"

      # For automated deployment via workflow_run
      - name: Download workflow artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read version from artifact
        if: github.event_name == 'workflow_run'
        id: read_version
        run: |
          echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Set deployment version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.read_version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      # Common deployment step using the determined version
      - name: Trigger Frontera App Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FE_TESTS_GITHUB_TOKEN }}
          repository: customeros/cloud
          event-type: deploy-frontera-app
          client-payload: '{"version": "${{ steps.set_version.outputs.version }}"}'